name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf

      - name: Python tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: CDP helper tests
        run: node --test scripts/tests/test_cdp.js

      - name: Browser capture tests
        run: node --test scripts/tests/test_capture_cdp.js
